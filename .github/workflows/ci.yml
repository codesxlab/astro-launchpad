name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # Astro 7 needs Node >= 22.23.4; the runner's cached 22.x can be older.
          check-latest: true
          cache: npm
      - run: npm ci
      # `build` runs `astro check` (types) before `astro build`.
      - run: npm run build
